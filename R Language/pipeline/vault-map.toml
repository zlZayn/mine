# =============================================================================
#  内容来源映射
#
#  这里记录「仓库里的文章」与「仓库外的原始笔记」之间的对应关系。
#  它是一次性迁移（migrate）用的数据，不是代码 —— 所以从 migrate.py 里抽出来。
#
#  为什么不写库根路径：
#    写个人机器的绝对路径会让流水线无法在别的机器或 CI 上运行。
#    库根改为按下面的顺序解析（见 migrate.py 的 resolve_vault_root）：
#      1. 命令行 --vault-root
#      2. 环境变量 RLANG_VAULT_ROOT
#      3. 从本文件所在目录逐级向上找含 .obsidian 的目录
# =============================================================================

[vault]
# 留空 = 自动探测（推荐）。填了就优先用它，仅用于本机调试。
# 例：root = "D:/ObsidianDirectory"
root = ""

# 自动探测时的候选起点（相对仓库根）。这些目录下若存在 .obsidian 即认定为库根。
probe_from = [
  "R Language/pipeline",
  "R Language",
  ".",
]

# 在库根下、用来定位库根的标志
markers = [".obsidian", ".rlang-vault-root"]

# -----------------------------------------------------------------------------
# 权威中文标题覆盖表
#
#   Obsidian 源码里的 zhihu-title 与实际发布到知乎的标题存在漂移，例如
#     mice  源码「…多重插补」          线上「…多重插补与批量建模」
#     broom 源码「broom包进行整洁建模」 线上「broom 包进行整洁建模」
#   若以源码为准，index.html 上的中文标题会与知乎页面对不上。
#   凡有出入者，以旧 index.html 里已发布过的标题为准，显式登记在这里。
#
#   前缀（【R 语言】）由流水线强制补齐，此处写全也无妨。
# -----------------------------------------------------------------------------
[canonical_zh_titles]
anonymous-functions = "【R 语言】匿名函数"
a-workflow-based-on-nested-data-frames = "【R 语言】一种基于嵌套数据框的工作流"
mice-package-for-multiple-imputation-and-batch-modeling = "【R 语言】mice 包进行缺失值多重插补与批量建模"
broom-package-for-tidy-modeling = "【R 语言】broom 包进行整洁建模"
chi-square-distribution-and-convolution-effect = "【R 语言】卡方分布与卷积效应"
rust-extensions-for-r = "【R 语言】用 Rust 给 R 写扩展：完整实践指南"
tidymodels-worldview = "【R 语言】tidymodels 的世界观：一门藏在 R 里的严谨语言"

# -----------------------------------------------------------------------------
# 每篇文章的来源
#
#   slug          仓库内的文章标识（也是 en/<slug>/ 与 zh/<slug>/ 的目录名）
#   zh_source     中文笔记相对库根的路径；指向目录时自动取同名 .md，
#                 也可直接写 .md 文件路径
#   zh_md         目录内 md 的文件名（仅当它与目录名不同才需要写）
#   en_old        旧的平铺英文文件名（相对 R Language/），迁移后该文件被删除
#   zhihu_link    知乎原文链接，卡片上的「中文-知乎」按钮用它
#   created_at    发布时间，格式 "2025-10-14 15:11"；留空则排序时排到最后
#   topic         zhihu-topics 的值
# -----------------------------------------------------------------------------

