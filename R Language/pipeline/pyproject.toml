[project]
name = "rlang-pipeline"
version = "1.0.0"
description = "R Language 专栏的发布流水线：从 Markdown frontmatter 生成 index.html"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.5",
    "pygments>=2.17",
]

[project.scripts]
rlang-pipeline = "rlang_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlang_pipeline"]

[dependency-groups]
dev = ["pytest>=8.0"]
