[project]
name = "rlang-pipeline"
version = "1.0.0"
description = "R Language 专栏的发布流水线：从 Markdown frontmatter 生成 index.html"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.5",
    "pygments>=2.17",
]

[project.scripts]
rlang-pipeline = "rlang_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlang_pipeline"]

[tool.uv]
# Pin the lockfile registry to official PyPI. Without this, the machine-global
# ~/AppData/Roaming/uv/uv.toml index-url (a mirror) outranks the registry
# already recorded in uv.lock, and any `uv lock` rewrites all of it.
# Note: `default-index` is rejected by uv 0.11 (unknown field, the whole
# [tool.uv] section is then ignored) — it must be the [[tool.uv.index]] table.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = ["pytest>=8.0"]
