<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品边框合成工具</title>
<style>
/* ===== 设计变量 ===== */
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --green: #059669;
  --green-hover: #047857;
  --text: #111827;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --border: #e5e7eb;
  --bg: #f3f4f6;
  --card-bg: #fff;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.04);
  --radius: 16px;
  --radius-sm: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* ===== 基础 ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px;
  font-family: var(--font);
  color: var(--text);
}

.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  width: 100%;
  max-width: 1120px;
  position: relative;
  overflow: hidden;
  transition: filter .4s;
}
.card.loading { pointer-events: none; }

h1 { font-size: 16px; font-weight: 700; }
h1 small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ===== 两栏布局 ===== */
.layout { display: flex; gap: 28px; align-items: stretch; }

.left-col {
  flex: 1;
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.right-col {
  width: 400px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

/* ===== 左栏：合成预览 ===== */
.preview-stage {
  width: 100%;
  max-width: 600px;
  aspect-ratio: 1/1;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 0;   /* 直角方形容器 */
  overflow: hidden;
  position: relative;
  box-shadow: inset 0 1px 2px rgba(0,0,0,.05);
}
.stage-wrap { position: absolute; top: 0; left: 0; width: 2475px; height: 2475px; background: #fff; transform-origin: 0 0; }
#stageImg { position: absolute; }
#stageBorder { position: absolute; top: 0; left: 0; width: 2475px; height: 2475px; }
#stageBorder svg { width: 100%; height: 100%; display: block; }
.stage-empty {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 13px;
}

/* ===== 边框选项卡 ===== */
.tabs { display: flex; gap: 3px; }
.tab {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 3px 4px;
  border: 2px solid var(--border);
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  transition: all .15s;
  text-align: left;
}
.tab:hover { border-color: var(--primary); box-shadow: 0 1px 4px rgba(79,70,229,.12); }
.tab.active { border-color: var(--primary); background: var(--primary-light); }
.tab-mini {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  overflow: hidden;
  background: #f8f9fb;
  flex-shrink: 0;
}
.tab-mini svg { width: 100%; height: 100%; display: block; }
#mini-none { background: #fff; box-shadow: inset 0 0 0 1px var(--border); }   /* 无边框=纯白底 */
.tab-label { font-size: 11px; font-weight: 600; color: var(--text); line-height: 1.2; white-space: nowrap; }
.tab-sub { font-size: 9px; color: var(--text-muted); white-space: nowrap; }

/* ===== 上传区（紧凑横条） ===== */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: 10px;
  text-align: left;
  cursor: pointer;
  transition: all .2s;
  background: var(--bg);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  position: relative;
  overflow: hidden;
}
.upload-zone::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--primary-light), transparent 60%);
  opacity: 0;
  transition: opacity .2s;
}
.upload-zone:hover::before, .upload-zone.dragover::before { opacity: 1; }
.upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); }
.upload-zone.has-image { padding: 8px 12px; border-style: solid; border-color: var(--border); background: var(--card-bg); }
.upload-zone.has-image::before { display: none; }
.upload-zone.has-image:hover { border-color: var(--primary); }
.upload-icon {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: var(--text-muted);
  stroke-width: 1.5;
  flex-shrink: 0;
  position: relative;
}
.upload-zone.has-image .upload-icon { display: none; }
.upload-text { color: var(--text-secondary); font-size: 12px; line-height: 1.5; position: relative; }
.upload-zone.has-image .upload-text { display: none; }
.preview-area { display: none; flex: 1; min-width: 0; align-items: center; gap: 10px; position: relative; }
.upload-zone.has-image .preview-area { display: flex; }
.preview-img { max-width: 46px; max-height: 46px; border-radius: 6px; display: block; flex-shrink: 0; background: #fff; }
.reupload-hint {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.5);
  border-radius: 8px;
  color: #fff;
  font-size: 11px;
  font-weight: 500;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(2px);
}
.upload-zone.has-image .preview-area:hover .reupload-hint { display: flex; }
.file-info { font-size: 11px; color: var(--text-secondary); word-break: break-all; line-height: 1.3; flex: 1; min-width: 0; }
.dim-info { font-size: 10px; color: var(--text-muted); }

/* ===== 控制区 ===== */
.controls { width: 100%; display: flex; flex-direction: column; gap: 7px; }
.control-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.control-label { font-size: 13px; font-weight: 600; color: var(--text); }
.adj-row .control-label { width: 64px; flex-shrink: 0; }   /* 固定标签宽度，滑杆对齐等长 */
.adj-row { display: flex; align-items: center; gap: 6px; }
.adj-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
  height: 6px;
  cursor: pointer;
}
.adj-slider::-webkit-slider-runnable-track { height: 6px; background: #d1d5db; border-radius: 3px; }
.adj-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--primary);
  border: 3px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
  margin-top: -4px;
  cursor: pointer;
}
.adj-slider::-moz-range-track { height: 6px; background: #d1d5db; border-radius: 3px; border: none; }
.adj-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--primary);
  border: 3px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
  cursor: pointer;
}
.adj-val { width: 44px; text-align: right; font-size: 11px; color: var(--text-muted); flex-shrink: 0; }

/* ===== 格式切换 / 尺寸选择 ===== */
.seg { display: flex; background: var(--bg); border-radius: var(--radius-sm); padding: 3px; gap: 3px; }
.seg button {
  flex: 1;
  padding: 6px 10px;
  border: none;
  border-radius: 8px;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
#dlModeSeg { width: 200px; }
.seg button.active { background: #fff; color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.size-sel {
  width: 180px;
  flex-shrink: 0;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card-bg);
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  outline: none;
  transition: border-color .15s;
}
.size-sel:focus { border-color: var(--primary); }

/* ===== 按钮 ===== */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 9px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.btn svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: var(--green-hover); box-shadow: 0 2px 8px rgba(5,150,101,.3); }
.btn-green:disabled { background: #c4c9d4; box-shadow: none; cursor: not-allowed; }
/* 按住看原图：取景式按钮，按下时反白 */
.btn-peek { background: var(--primary-light); color: var(--primary); border: 2px solid var(--primary); padding: 8px; }
.btn-peek:hover { background: #e0e7ff; }
.btn-peek.holding, .btn-peek:active { background: var(--primary); color: #fff; }
.btn-peek:disabled { color: #c4c9d4; border-color: #d8dce4; background: #fff; cursor: not-allowed; }

/* 重置：次级弱化按钮，确认态变警示色 */
.btn-reset { background: #fff; color: var(--text-secondary); border: 2px solid var(--border); padding: 8px; }
.btn-reset:hover { border-color: var(--text-muted); color: var(--text); }
.btn-reset.confirming { background: #fef2f2; color: #dc2626; border-color: #dc2626; }
.btn-reset:disabled { color: #c4c9d4; border-color: #d8dce4; background: #fff; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; width: auto; }

footer { text-align: center; margin-top: 8px; font-size: 11px; color: var(--text-muted); }

/* ===== 加载遮罩 ===== */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  background: rgba(255,255,255,.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.overlay.show { display: flex; }
.overlay-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.overlay-text { font-size: 14px; font-weight: 600; color: var(--text); }
.overlay-sub { font-size: 12px; color: var(--text-muted); }
.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid #e5e7eb;
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

#svgStore { display: none; }

/* ===== 全屏拖拽遮罩 ===== */
.drop-overlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.03);
  backdrop-filter: blur(0px);
  -webkit-backdrop-filter: blur(0px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .3s ease, visibility .3s ease, background .3s ease,
              backdrop-filter .3s ease, -webkit-backdrop-filter .3s ease;
}
.drop-overlay.show {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  background: rgba(0,0,0,.12);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.drop-overlay-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  background: var(--card-bg);
  border-radius: 16px;
  padding: 36px 48px;
  box-shadow: var(--shadow);
  border: 2px dashed var(--primary);
}
.drop-overlay-icon { width: 44px; height: 44px; fill: none; stroke: var(--primary); stroke-width: 1.5; }
.drop-overlay-text { font-size: 18px; font-weight: 700; color: var(--primary); }
.drop-overlay-sub { font-size: 13px; color: var(--text-secondary); }

/* ===== 响应式 ===== */
@media (max-width: 920px) {
  body { padding: 16px; }
  .card { padding: 20px; }
  .layout { flex-direction: column; gap: 16px; }
  .left-col, .right-col { width: 100%; }
  .upload-zone { min-height: 56px; }
  .tabs { flex-wrap: wrap; }
  .tab { flex: 1 1 100%; }
}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="layout">

    <!-- 左栏：合成预览 -->
    <div class="left-col">
      <div class="preview-stage" id="stage">
        <div class="stage-wrap" id="stageWrap">
          <img id="stageImg" alt="" style="display:none">
          <div id="stageBorder"></div>
        </div>
        <div class="stage-empty" id="stageEmpty">请先选择边框并放入商品图</div>
      </div>
    </div>

    <!-- 右栏：标题 / 选项卡 / 上传 / 控制 -->
    <div class="right-col">
      <h1>商品边框合成工具<small>选择边框 → 放入商品图 → 导出白底 1:1 图片</small></h1>

      <div class="tabs" id="tabs">
        <button class="tab" data-key="rx">
          <span class="tab-mini" id="mini-rx"></span>
          <span><span class="tab-label">Rx</span><br><span class="tab-sub">处方药</span></span>
        </button>
        <button class="tab" data-key="ja">
          <span class="tab-mini" id="mini-ja"></span>
          <span><span class="tab-label">甲类 OTC</span><br><span class="tab-sub">红色标识</span></span>
        </button>
        <button class="tab" data-key="yi">
          <span class="tab-mini" id="mini-yi"></span>
          <span><span class="tab-label">乙类 OTC</span><br><span class="tab-sub">绿色标识</span></span>
        </button>
        <button class="tab" data-key="wu">
          <span class="tab-mini" id="mini-wu"></span>
          <span><span class="tab-label">无标识</span><br><span class="tab-sub">无药品标识</span></span>
        </button>
        <button class="tab active" data-key="none">
          <span class="tab-mini" id="mini-none"></span>
          <span><span class="tab-label">无边框</span><br><span class="tab-sub">纯白底</span></span>
        </button>
      </div>

      <div class="upload-zone" id="dropZone">
        <svg class="upload-icon" viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4l4 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="upload-text">点击或拖拽商品图</div>
        <div class="preview-area">
          <img class="preview-img" id="preview" alt="">
          <div class="reupload-hint">点击更换</div>
          <div class="file-info" id="fileInfo"></div>
          <div class="dim-info" id="dimInfo"></div>
        </div>
      </div>

      <div class="controls">
        <div class="adj-row">
          <span class="control-label">商品大小</span>
          <input type="range" class="adj-slider" id="zoomSlider" min="50" max="160" value="90" step="1">
          <span class="adj-val" id="zoomVal">90%</span>
        </div>
        <div class="adj-row">
          <span class="control-label">亮度</span>
          <input type="range" class="adj-slider" id="brightnessSlider" min="50" max="150" value="100" step="1">
          <span class="adj-val" id="brightnessVal">100%</span>
        </div>
        <div class="adj-row">
          <span class="control-label">对比度</span>
          <input type="range" class="adj-slider" id="contrastSlider" min="50" max="150" value="100" step="1">
          <span class="adj-val" id="contrastVal">100%</span>
        </div>
        <div class="adj-row">
          <span class="control-label">饱和度</span>
          <input type="range" class="adj-slider" id="saturationSlider" min="0" max="200" value="100" step="1">
          <span class="adj-val" id="saturationVal">100%</span>
        </div>
        <div class="adj-row">
          <span class="control-label">旋转</span>
          <input type="range" class="adj-slider" id="rotSlider" min="-180" max="180" value="0" step="1">
          <span class="adj-val" id="rotVal">0°</span>
        </div>
        <div class="adj-row">
          <span class="control-label">高光</span>
          <input type="range" class="adj-slider" id="highlightSlider" min="-100" max="100" value="0" step="1">
          <span class="adj-val" id="highlightVal">0</span>
        </div>
        <div class="adj-row">
          <span class="control-label">白色色阶</span>
          <input type="range" class="adj-slider" id="whitesSlider" min="-100" max="100" value="0" step="1">
          <span class="adj-val" id="whitesVal">0</span>
        </div>
        <div class="adj-row">
          <span class="control-label">阴影</span>
          <input type="range" class="adj-slider" id="shadowSlider" min="-100" max="100" value="0" step="1">
          <span class="adj-val" id="shadowVal">0</span>
        </div>
        <div class="adj-row">
          <span class="control-label">锐化</span>
          <input type="range" class="adj-slider" id="sharpenSlider" min="0" max="100" value="0" step="1">
          <span class="adj-val" id="sharpenVal">0</span>
        </div>

        <div class="control-row">
          <span class="control-label">导出格式</span>
          <div class="seg" style="width:180px">
            <button data-fmt="png">PNG</button>
            <button class="active" data-fmt="jpg">JPG</button>
          </div>
        </div>

        <div class="control-row">
          <span class="control-label">导出尺寸</span>
          <select class="size-sel" id="sizeSel">
            <option value="2475" selected>2475×2475</option>
            <option value="2000">2000×2000</option>
            <option value="1500">1500×1500</option>
            <option value="1200">1200×1200</option>
            <option value="1080">1080×1080</option>
            <option value="800">800×800</option>
            <option value="500">500×500</option>
          </select>
        </div>

        <div class="control-row">
          <span class="control-label">导出方式</span>
          <div class="seg" id="dlModeSeg">
            <button class="active" data-dlmode="folder">指定文件夹</button>
            <button data-dlmode="each">直接下载</button>
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-peek" id="holdBtn" disabled>
            <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            按住看原图
          </button>
          <button class="btn btn-reset" id="resetBtn" disabled>
            <svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2-9.4L1 10"/></svg>
            重置
          </button>
        </div>

        <button class="btn btn-green" id="exportBtn" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span id="exportLabel">导出图片</span>
        </button>
      </div>
    </div>
  </div>

  <footer>纯浏览器端处理，图片不会上传到任何服务器 · 原图 2475×2475，可选多种导出尺寸 · 导出方式：指定文件夹（推荐）/ 直接下载</footer>

  <!-- 加载遮罩 -->
  <div class="overlay" id="overlay">
    <div class="overlay-inner">
      <div class="spinner"></div>
      <div class="overlay-text">正在合成</div>
      <div class="overlay-sub">生成图片中...</div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ===== 元素引用 ===== */
const $ = id => document.getElementById(id);

const dz = $('dropZone'), pv = $('preview'), fi = $('fileInfo'), di = $('dimInfo');
const stage = $('stage'), stageWrap = $('stageWrap'), stageImg = $('stageImg');
const stageBorder = $('stageBorder'), stageEmpty = $('stageEmpty');
const zoomSlider = $('zoomSlider'), zoomVal = $('zoomVal');
const brightnessSlider = $('brightnessSlider'), brightnessVal = $('brightnessVal');
const contrastSlider = $('contrastSlider'), contrastVal = $('contrastVal');
const saturationSlider = $('saturationSlider'), saturationVal = $('saturationVal');
const rotSlider = $('rotSlider'), rotVal = $('rotVal');
const highlightSlider = $('highlightSlider'), highlightVal = $('highlightVal');
const whitesSlider = $('whitesSlider'), whitesVal = $('whitesVal');
const shadowSlider = $('shadowSlider'), shadowVal = $('shadowVal');
const sharpenSlider = $('sharpenSlider'), sharpenVal = $('sharpenVal');
const sizeSel = $('sizeSel');
const holdBtn = $('holdBtn'), resetBtn = $('resetBtn');
const exportBtn = $('exportBtn');
const card = $('card'), overlay = $('overlay');
const FMT_BTN = {
  png: document.querySelector('.seg button[data-fmt=png]'),
  jpg: document.querySelector('.seg button[data-fmt=jpg]')
};

/* ===== 常量与状态 ===== */
const WIN = { cx: 1237.5, cy: 1237.5, size: 2339 };   // 边框窗口中心与尺寸（2475 坐标系）
const BORDERS = {
  rx: { el: 'b-rx', name: 'Rx' },
  ja: { el: 'b-ja', name: '甲类OTC' },
  yi: { el: 'b-yi', name: '乙类OTC' },
  wu: { el: 'b-wu', name: '无药品标识' },
  none: { el: null, name: '无边框' }
};

let cur = 'none';              // 当前边框（默认无边框）
let img = null;                // 商品 HTMLImageElement
let imgName = 'product';       // 商品原文件名（导出命名用）
let origSrc = '';              // 商品原始 dataURL
let defaultScale = 1;          // 适配窗口的基准缩放
let fmt = 'jpg';               // 导出格式

/* ===== 边框源 SVG ===== */
function getBorderSvg(key) {
  return document.getElementById(BORDERS[key].el);
}

function cloneBorderInto(key, container) {
  container.innerHTML = '';
  const clone = getBorderSvg(key).cloneNode(true);
  clone.removeAttribute('id');   // 去掉重复 id，避免干扰 getElementById
  container.appendChild(clone);
}

/* ===== 选项卡 ===== */
function setBorder(key) {
  cur = key;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  if (key === 'none') {
    stageBorder.innerHTML = '';              // 无边框模式：清空并隐藏
    stageBorder.style.display = 'none';
  } else {
    cloneBorderInto(key, stageBorder);
    stageBorder.style.display = 'block';
  }
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setBorder(t.dataset.key)));

// 选项卡迷你预览
['rx', 'ja', 'yi', 'wu'].forEach(k => cloneBorderInto(k, $('mini-' + k)));
// 无边框迷你预览：纯白底方块

/* ===== 预览缩放（随容器尺寸） ===== */
function fitStage() {
  const w = stage.clientWidth || 320;
  stage.style.height = w + 'px';          // 保证方形，不依赖 aspect-ratio
  stageWrap.style.transform = 'scale(' + (w / 2475) + ')';
}
const ro = new ResizeObserver(fitStage);
ro.observe(stage);

/* ===== 商品图放置 ===== */
function placeProduct() {
  if (!img) return;
  const s = defaultScale * (+zoomSlider.value / 100);
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  stageImg.style.width = w + 'px';
  stageImg.style.height = h + 'px';
  stageImg.style.left = (WIN.cx - w / 2) + 'px';
  stageImg.style.top = (WIN.cy - h / 2) + 'px';
  stageImg.style.display = 'block';
  stageEmpty.style.display = 'none';
  // 边框显示由 setBorder 统一管理，此处不干预
}

/* ===== 基础调整：亮度 / 对比度 / 饱和度 / 旋转（CSS 滤镜，只作用于商品图） ===== */
function refreshAdjustPreview() {
  stageImg.style.filter = 'contrast(' + contrastSlider.value + '%) brightness(' + brightnessSlider.value + '%) saturate(' + saturationSlider.value + '%)';
  stageImg.style.transform = 'rotate(' + rotSlider.value + 'deg)';
  brightnessVal.textContent = brightnessSlider.value + '%';
  contrastVal.textContent = contrastSlider.value + '%';
  saturationVal.textContent = saturationSlider.value + '%';
  rotVal.textContent = rotSlider.value + '°';
}
[brightnessSlider, contrastSlider, saturationSlider, rotSlider]
  .forEach(s => s.addEventListener('input', refreshAdjustPreview));
refreshAdjustPreview();

/* ===== 色调调整：高光 / 白色色阶 / 阴影 / 锐化（像素级处理，只作用于商品图） ===== */
function applyTone(data, h, w, s) {
  h /= 100; w /= 100; s /= 100;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const l = 0.299 * r + 0.587 * g + 0.114 * b;
    const mh = Math.max(0, Math.min(1, (l - 128) / 127));   // 高光：亮度 128 以上渐变生效
    const mw = Math.max(0, Math.min(1, (l - 96) / 159));    // 白色：亮度 96 以上（范围更广）
    const ms = Math.max(0, Math.min(1, (128 - l) / 128));   // 阴影：亮度 128 以下
    const dlt = h * mh * 90 + w * mw * 100 + s * ms * 100;
    data[i]     = Math.max(0, Math.min(255, r + dlt));
    data[i + 1] = Math.max(0, Math.min(255, g + dlt));
    data[i + 2] = Math.max(0, Math.min(255, b + dlt));
  }
}

/* 盒式模糊（直接邻域求和，clamp 边界，仅 RGB，alpha 原样保留）— 锐化的基础 */
function blurPass(src, w, h, horizontal, r) {
  const out = new Uint8ClampedArray(src.length);
  const size = 2 * r + 1;
  const half = r;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let sumR = 0, sumG = 0, sumB = 0;
      for (let d = -half; d <= half; d++) {
        let px = x, py = y;
        if (horizontal) px = x + d; else py = y + d;
        if (px < 0) px = 0; else if (px >= w) px = w - 1;
        if (py < 0) py = 0; else if (py >= h) py = h - 1;
        const idx = (py * w + px) * 4;
        sumR += src[idx]; sumG += src[idx + 1]; sumB += src[idx + 2];
      }
      const o = (y * w + x) * 4;
      out[o] = sumR / size; out[o + 1] = sumG / size; out[o + 2] = sumB / size;
      out[o + 3] = src[o + 3];
    }
  }
  return out;
}

/* 锐化：反锐化掩模（原图 + 强度 × 原图与模糊之差），强度 0-100 */
function applySharpen(data, w, h, val) {
  if (val <= 0) return;
  const f = val / 40;                       // 0-100 → 0-2.5
  const r = val >= 70 ? 2 : 1;              // 高强度时模糊半径加大，避免过硬
  const tmp = blurPass(data, w, h, true, r);
  const blur = blurPass(tmp, w, h, false, r);
  for (let i = 0; i < data.length; i += 4) {
    const d0 = data[i], d1 = data[i + 1], d2 = data[i + 2];
    data[i]     = Math.max(0, Math.min(255, d0 + (d0 - blur[i]) * f));
    data[i + 1] = Math.max(0, Math.min(255, d1 + (d1 - blur[i + 1]) * f));
    data[i + 2] = Math.max(0, Math.min(255, d2 + (d2 - blur[i + 2]) * f));
  }
}

function renderTone(maxSide) {
  const h = +highlightSlider.value, w = +whitesSlider.value, s = +shadowSlider.value, sh = +sharpenSlider.value;
  if (h === 0 && w === 0 && s === 0 && sh === 0) return img;   // 无需处理，返回原图
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const k = Math.min(1, maxSide / Math.max(nw, nh));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(nw * k));
  c.height = Math.max(1, Math.round(nh * k));
  const cx = c.getContext('2d');
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(img, 0, 0, c.width, c.height);
  const id = cx.getImageData(0, 0, c.width, c.height);
  if (h || w || s) applyTone(id.data, h, w, s);
  if (sh) applySharpen(id.data, c.width, c.height, sh);
  cx.putImageData(id, 0, 0);
  return c;
}

function fmtAdj(v) { return v === 0 ? '0' : (v > 0 ? '+' : '') + v; }

function refreshTonePreview() {
  highlightVal.textContent = fmtAdj(+highlightSlider.value);
  whitesVal.textContent = fmtAdj(+whitesSlider.value);
  shadowVal.textContent = fmtAdj(+shadowSlider.value);
  sharpenVal.textContent = sharpenSlider.value;
  if (!img) return;
  const c = renderTone(700);   // 预览小尺寸，实时无感
  stageImg.src = (c === img) ? origSrc : c.toDataURL('image/png');
}
[highlightSlider, whitesSlider, shadowSlider, sharpenSlider]
  .forEach(s => s.addEventListener('input', refreshTonePreview));
refreshTonePreview();

/* ===== 加载商品图 ===== */
function loadFile(f) {
  if (!f || !f.type.startsWith('image/')) return;
  imgName = f.name.replace(/\.[^.]+$/, '');
  const rdr = new FileReader();
  rdr.onload = e => {
    const im = new Image();
    im.onload = () => {
      img = im;
      defaultScale = Math.min((WIN.size * 0.92) / im.naturalWidth, (WIN.size * 0.92) / im.naturalHeight);
      origSrc = e.target.result;
      pv.src = e.target.result;
      stageImg.src = e.target.result;   // 合成预览区的商品图
      di.textContent = im.naturalWidth + '×' + im.naturalHeight;
      fi.textContent = f.name + ' · ' + (f.size < 1024 ? f.size + ' B' : (f.size / 1024).toFixed(1) + ' KB');
      dz.classList.add('has-image');
      exportBtn.disabled = false;
      holdBtn.disabled = false;
      resetBtn.disabled = false;
      zoomSlider.value = 90;
      zoomVal.textContent = '90%';
      placeProduct();
      refreshTonePreview();   // 新图按当前高光/白色/阴影/锐化设置重新处理
      setBorder(cur);         // 上传后重新应用当前选中的边框，防止状态错乱
    };
    im.onerror = () => alert('图片加载失败，请换一张重试');
    im.src = e.target.result;
  };
  rdr.readAsDataURL(f);
}

// 上传区：点击选择
dz.addEventListener('click', () => {
  const i = document.createElement('input');
  i.type = 'file';
  i.accept = 'image/*';
  i.onchange = () => { if (i.files[0]) loadFile(i.files[0]); };
  i.click();
});
// 上传区：拖拽
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('dragover');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

/* ===== 商品大小滑杆 ===== */
zoomSlider.addEventListener('input', () => {
  zoomVal.textContent = zoomSlider.value + '%';
  placeProduct();
});

/* ===== 按住看原图（取景式：按下反白，松开恢复） ===== */
function showOriginalPreview() {
  if (!img) return;
  stageImg.src = origSrc;
  stageImg.style.filter = 'none';
  stageImg.style.transform = 'none';
}

function restoreAdjustedPreview() {
  refreshAdjustPreview();
  refreshTonePreview();
}

function setHoldState(on) {
  holdBtn.classList.toggle('holding', on);
}

holdBtn.addEventListener('mousedown', e => { e.preventDefault(); setHoldState(true); showOriginalPreview(); });
document.addEventListener('mouseup', () => { setHoldState(false); restoreAdjustedPreview(); });
holdBtn.addEventListener('mouseleave', () => { setHoldState(false); restoreAdjustedPreview(); });
holdBtn.addEventListener('touchstart', e => { e.preventDefault(); setHoldState(true); showOriginalPreview(); });
holdBtn.addEventListener('touchend', () => { setHoldState(false); restoreAdjustedPreview(); });
holdBtn.addEventListener('touchcancel', () => { setHoldState(false); restoreAdjustedPreview(); });

/* ===== 重置所有商品调整（双击确认，防误触） ===== */
let resetArmed = false, resetTimer = null;

function doReset() {
  resetArmed = false;
  if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
  resetBtn.textContent = '重置';
  resetBtn.classList.remove('confirming');
  zoomSlider.value = 90; zoomVal.textContent = '90%';
  brightnessSlider.value = 100; contrastSlider.value = 100; saturationSlider.value = 100;
  rotSlider.value = 0;
  highlightSlider.value = 0; whitesSlider.value = 0; shadowSlider.value = 0; sharpenSlider.value = 0;
  placeProduct();
  refreshAdjustPreview();
  refreshTonePreview();
}

resetBtn.addEventListener('click', () => {
  if (resetArmed) { doReset(); return; }
  resetArmed = true;
  resetBtn.textContent = '是否确认重置？';
  resetBtn.classList.add('confirming');   // 确认态变警示红
  resetTimer = setTimeout(() => {
    resetArmed = false;
    resetBtn.textContent = '重置';
    resetBtn.classList.remove('confirming');
  }, 3000);
});

/* ===== 导出格式切换 ===== */
Object.values(FMT_BTN).forEach(b => b.addEventListener('click', () => {
  fmt = b.dataset.fmt;
  Object.values(FMT_BTN).forEach(x => x.classList.toggle('active', x === b));
}));

/* ===== 导出方式切换：指定文件夹 / 直接下载 ===== */
let dlMode = 'folder';   // folder=指定文件夹 / each=直接下载
const DL_MODE_BTN = {
  folder: document.querySelector('#dlModeSeg button[data-dlmode=folder]'),
  each: document.querySelector('#dlModeSeg button[data-dlmode=each]')
};
Object.values(DL_MODE_BTN).forEach(b => b.addEventListener('click', () => {
  dlMode = b.dataset.dlmode;
  Object.values(DL_MODE_BTN).forEach(x => x.classList.toggle('active', x === b));
}));

/* ===== 保存文件：指定文件夹（File System Access API，一次选目录直接写入）/ 直接下载 ===== */
async function saveBlob(blob, name) {
  if (dlMode === 'folder' && window.showDirectoryPicker) {
    let dir;
    try {
      dir = await window.showDirectoryPicker();
    } catch (err) {
      if (err && err.name === 'AbortError') return 'cancel';   // 用户取消选目录
      return 'error';
    }
    // 同名自动加序号，避免覆盖
    let n = name, seq = 1;
    for (;;) {
      try { await dir.getFileHandle(n); n = name.replace(/\.[^.]+$/, '') + '_' + (seq++) + '.' + name.split('.').pop(); }
      catch { break; }
    }
    const fh = await dir.getFileHandle(n, { create: true });
    const w = await fh.createWritable();
    await w.write(blob);
    await w.close();
    return 'folder';
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  return 'download';
}

/* ===== 导出 ===== */
function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = src;
  });
}

async function doExport() {
  if (!img) return;
  const isPng = fmt === 'png';
  const N = +sizeSel.value, k = N / 2475;   // 目标尺寸与缩放系数
  exportBtn.disabled = true;
  card.classList.add('loading');
  overlay.classList.add('show');
  try {
    const c = document.createElement('canvas');
    c.width = N; c.height = N;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, N, N);

    // 商品图（高光/白色/阴影/锐化需要时用像素处理后的画布）
    const s = defaultScale * (+zoomSlider.value / 100);
    const w = img.naturalWidth * s, h = img.naturalHeight * s;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    let prod = img;
    const hAdj = +highlightSlider.value, wAdj = +whitesSlider.value, sAdj = +shadowSlider.value, shAdj = +sharpenSlider.value;
    if (hAdj || wAdj || sAdj || shAdj) {
      const needW = Math.min(img.naturalWidth, Math.round(img.naturalWidth * defaultScale * (+zoomSlider.value / 100)));
      const needH = Math.min(img.naturalHeight, Math.round(img.naturalHeight * defaultScale * (+zoomSlider.value / 100)));
      prod = renderTone(Math.max(needW, needH));
    }
    ctx.save();
    ctx.filter = 'contrast(' + contrastSlider.value + '%) brightness(' + brightnessSlider.value + '%) saturate(' + saturationSlider.value + '%)';
    ctx.translate(WIN.cx * k, WIN.cy * k);
    ctx.rotate((+rotSlider.value) * Math.PI / 180);
    ctx.drawImage(prod, -w * k / 2, -h * k / 2, w * k, h * k);
    ctx.restore();

    // 边框 SVG（矢量，任意尺寸清晰；无边框模式跳过）
    if (cur !== 'none') {
      const svg = getBorderSvg(cur);
      let str = new XMLSerializer().serializeToString(svg);
      if (!/xmlns="http:\/\/www\.w3\.org\/2000\/svg"/.test(str)) {
        str = str.replace(/<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      const bimg = await loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str));
      ctx.drawImage(bimg, 0, 0, N, N);
    }

    // 保存：指定文件夹（推荐）/ 直接下载
    const blob = await new Promise(r => c.toBlob(r, isPng ? 'image/png' : 'image/jpeg', isPng ? undefined : 0.95));
    const name = imgName + '_' + BORDERS[cur].name + (N !== 2475 ? '_' + N : '') + '.' + (isPng ? 'png' : 'jpg');
    const saved = await saveBlob(blob, name);
    if (saved === 'error') {
      alert('保存失败：当前浏览器可能不支持指定文件夹，请改用“直接下载”');
    } else if (saved === 'folder') {
      $('exportLabel').textContent = '已保存到文件夹';
      setTimeout(() => { $('exportLabel').textContent = '导出图片'; }, 2000);
    }
  } catch (err) {
    alert('导出失败：' + err.message);
  }
  exportBtn.disabled = false;
  card.classList.remove('loading');
  overlay.classList.remove('show');
}
exportBtn.addEventListener('click', doExport);

/* ===== 全屏拖拽：页面任意位置拖入图片，延迟淡入模糊提示 ===== */
const dropOverlay = $('dropOverlay');
let dragDepth = 0, showTimer = null;

function hideDropOverlay() {
  if (showTimer) { clearTimeout(showTimer); showTimer = null; }
  dropOverlay.classList.remove('show');
}

window.addEventListener('dragenter', e => {
  e.preventDefault();
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
  dragDepth++;
  if (!showTimer) showTimer = setTimeout(() => { dropOverlay.classList.add('show'); showTimer = null; }, 40);
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => {
  if (dragDepth > 0) dragDepth--;
  if (dragDepth === 0) hideDropOverlay();
});
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  hideDropOverlay();
  if (e.dataTransfer && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

/* ===== 初始化 ===== */
setBorder('none');   // 默认无边框（纯白底）
fitStage();
</script>
</body>
