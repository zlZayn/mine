<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量加水印工具</title>
<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --green: #059669;
  --green-hover: #047857;
  --text: #111827;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --border: #e5e7eb;
  --bg: #f3f4f6;
  --card-bg: #fff;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.04);
  --radius: 16px;
  --radius-sm: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px;
  font-family: var(--font);
  color: var(--text);
}

.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  width: 100%;
  max-width: 900px;
  position: relative;
  overflow: hidden;
}

h1 { font-size: 16px; font-weight: 700; }
h1 small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ===== 上传区 ===== */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius-sm);
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  background: var(--bg);
  padding: 36px 16px;
  margin-top: 16px;
  position: relative;
  overflow: hidden;
}
.upload-zone::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--primary-light), transparent 60%);
  opacity: 0;
  transition: opacity .2s;
}
.upload-zone:hover::before, .upload-zone.dragover::before { opacity: 1; }
.upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); }
.upload-zone.dragover { background: var(--primary-light); }
.upload-icon {
  width: 40px;
  height: 40px;
  fill: none;
  stroke: var(--text-muted);
  stroke-width: 1.5;
  margin-bottom: 8px;
  position: relative;
}
.upload-text { color: var(--text-secondary); font-size: 13px; line-height: 1.6; position: relative; }
.upload-sub { color: var(--text-muted); font-size: 11px; margin-top: 4px; position: relative; }

/* ===== 图片网格（棋盘格背景预览透明） ===== */
.count { margin-top: 16px; font-size: 12px; color: var(--text-secondary); }
.img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.img-card {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px;
  position: relative;
  background: #fff;
}
.img-thumb {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: contain;
  display: block;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: repeating-conic-gradient(#f1f3f5 0 25%, #fff 0 50%) 0 0/16px 16px;
}
.img-name {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.img-dims { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
.img-rm {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 20px;
  height: 20px;
  border: none;
  border-radius: 50%;
  background: rgba(17,24,39,.55);
  color: #fff;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.img-rm:hover { background: #dc2626; }

/* ===== 工具栏 ===== */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.toolbar-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.control-label { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }
.control { display: flex; align-items: center; gap: 8px; }
.control-value {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  background: var(--primary-light);
  border-radius: 6px;
  padding: 3px 8px;
  min-width: 40px;
  text-align: center;
}

/* 滑块（与图片压缩 / 商品边框工具统一） */
input[type=range] {
  -webkit-appearance: none;
  appearance: none;
  width: 130px;
  height: 6px;
  background: transparent;
  outline: none;
  cursor: pointer;
}
input[type=range]::-webkit-slider-runnable-track { height: 6px; background: #d1d5db; border-radius: 3px; }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--primary);
  border: 3px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
  margin-top: -5px;
  cursor: pointer;
  transition: transform .1s;
}
input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.1); }
input[type=range]::-moz-range-track { height: 6px; background: #d1d5db; border-radius: 3px; border: none; }
input[type=range]::-moz-range-thumb {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--primary);
  border: 3px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
  cursor: pointer;
}

.seg { display: flex; align-items: center; background: var(--bg); border-radius: var(--radius-sm); padding: 3px; gap: 3px; }
.seg button {
  flex: 0 0 auto;
  padding: 8px 14px;
  border: none;
  border-radius: 8px;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.seg button.active { background: #fff; color: var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.btn svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: var(--green-hover); box-shadow: 0 2px 8px rgba(5,150,101,.3); }
.btn-green:disabled { background: #c4c9d4; box-shadow: none; cursor: not-allowed; }
.btn-ghost { background: #fff; color: var(--text-secondary); border: 2px solid var(--border); padding: 9px 18px; }
.btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }
.btn-ghost:disabled { color: #c4c9d4; border-color: #d8dce4; cursor: not-allowed; }

.status { margin-top: 12px; font-size: 12px; color: var(--text-secondary); min-height: 18px; }
.status.done { color: var(--green); }

footer { text-align: center; margin-top: 18px; font-size: 11px; color: var(--text-muted); }

/* ===== 全屏拖拽遮罩 ===== */
.drop-overlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.03);
  backdrop-filter: blur(0px);
  -webkit-backdrop-filter: blur(0px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .3s ease, visibility .3s ease, background .3s ease,
              backdrop-filter .3s ease, -webkit-backdrop-filter .3s ease;
}
.drop-overlay.show {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  background: rgba(0,0,0,.12);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.drop-overlay-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  background: var(--card-bg);
  border-radius: 16px;
  padding: 36px 48px;
  box-shadow: var(--shadow);
  border: 2px dashed var(--primary);
}
.drop-overlay-icon { width: 44px; height: 44px; fill: none; stroke: var(--primary); stroke-width: 1.5; }
.drop-overlay-text { font-size: 18px; font-weight: 700; color: var(--primary); }
.drop-overlay-sub { font-size: 13px; color: var(--text-secondary); }
</style>
</head>
<body>

<div class="card">
  <h1>批量加水印工具<small>批量给图片打上透明水印，默认透明度 2%、水印为图短边的 20%，导出 JPG / PNG</small></h1>

  <div class="upload-zone" id="dropZone">
    <svg class="upload-icon" viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4l4 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="upload-text">点击或拖拽图片到此处（可多选）</div>
    <div class="upload-sub">支持 PNG / JPG / WebP，页面任意位置拖入也可</div>
  </div>

  <div class="count" id="count">已导入 0 张</div>
  <div class="img-grid" id="grid"></div>

  <div class="toolbar">
    <div class="toolbar-group">
      <div class="control">
        <span class="control-label">透明度</span>
        <input type="range" id="opacityRange" min="1" max="50" step="1" value="2">
        <span class="control-value" id="opacityVal">2%</span>
      </div>
      <div class="control">
        <span class="control-label">水印大小</span>
        <input type="range" id="sizeRange" min="5" max="50" step="1" value="20" title="水印宽度按每张图片自身短边的占比计算">
        <span class="control-value" id="sizeVal">20%</span>
      </div>
    </div>
    <div class="toolbar-group">
      <span class="control-label">布局</span>
      <div class="seg" id="layoutSeg">
        <button class="active" data-layout="tile">平铺</button>
        <button data-layout="center">居中</button>
      </div>
      <span class="control-label">格式</span>
      <div class="seg">
        <button data-fmt="png">PNG</button>
        <button class="active" data-fmt="jpg">JPG</button>
      </div>
      <span class="control-label">导出方式</span>
      <div class="seg" id="dlModeSeg">
        <button class="active" data-dlmode="folder">存文件夹</button>
        <button data-dlmode="each">逐个下载</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-group">
      <button class="btn btn-ghost" id="clearBtn" disabled>清空</button>
    </div>
    <div class="toolbar-group">
      <button class="btn btn-green" id="exportBtn" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        导出全部
      </button>
    </div>
  </div>
  <div class="status" id="status"></div>

  <footer>纯浏览器端处理，图片不会上传到任何服务器 · 水印按每张图片自身短边占比 20% 计算，透明度 2%，平铺覆盖 · 导出方式：存文件夹（推荐）/ 逐个下载</footer>
</div>

<div class="drop-overlay" id="dropOverlay">
  <div class="drop-overlay-inner">
    <svg class="drop-overlay-icon" viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4l4 4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="drop-overlay-text">松开鼠标即可放入图片</div>
    <div class="drop-overlay-sub">可批量拖放多张</div>
  </div>
</div>

let wmImg = new Image();
const wmUrl = URL.createObjectURL(new Blob([WATERSVG], { type: 'image/svg+xml' }));
wmImg.onload = () => { if (items.length) render(); };
wmImg.src = wmUrl;

/* ===== 状态 ===== */
let items = [];       // { file, url, im }
let fmt = 'jpg';
let layout = 'tile';  // tile=平铺 / center=居中
let opacity = 2;      // %
let sizePct = 20;     // 水印宽占图片短边的 %（按各图自身尺寸单独计算）

/* ===== 导入 ===== */
function addFiles(fileList) {
  let added = 0;
  Array.from(fileList).forEach(f => {
    if (!f.type.startsWith('image/')) return;
    const url = URL.createObjectURL(f);
    const im = new Image();
    im.onload = () => {
      items.push({ file: f, url: url, im: im });
      added++;
      render();
    };
    im.onerror = () => URL.revokeObjectURL(url);
    im.src = url;
  });
}

/* ===== 水印绘制 ===== */
function drawWatermark(ctx, imgW, imgH, ox, oy) {
  if (!wmImg.complete || !wmImg.naturalWidth) return;
  const wmW = Math.min(imgW, imgH) * sizePct / 100;
  const wmH = wmW * wmImg.naturalHeight / wmImg.naturalWidth;
  ctx.save();
  ctx.globalAlpha = opacity / 100;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  if (layout === 'tile') {
    const step = wmW * 1.6;
    for (let y = 0; y < imgH; y += step)
      for (let x = 0; x < imgW; x += step)
        ctx.drawImage(wmImg, ox + x, oy + y, wmW, wmH);
  } else {
    ctx.drawImage(wmImg, ox + (imgW - wmW) / 2, oy + (imgH - wmH) / 2, wmW, wmH);
  }
  ctx.restore();
}

/* ===== 渲染（卡片显示原图 + 水印预览） ===== */
function render() {
  count.textContent = '已导入 ' + items.length + ' 张';
  exportBtn.disabled = items.length === 0;
  clearBtn.disabled = items.length === 0;
  grid.innerHTML = '';
  items.forEach((it, i) => {
    const card = document.createElement('div');
    card.className = 'img-card';
    const cv = document.createElement('canvas');
    cv.className = 'img-thumb';
    cv.width = 260; cv.height = 260;
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, 260, 260);
    const scale = Math.min(260 / it.im.naturalWidth, 260 / it.im.naturalHeight);
    const dw = it.im.naturalWidth * scale, dh = it.im.naturalHeight * scale;
    const dx = (260 - dw) / 2, dy = (260 - dh) / 2;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(it.im, dx, dy, dw, dh);
    drawWatermark(ctx, dw, dh, dx, dy);
    const rm = document.createElement('button');
    rm.className = 'img-rm';
    rm.title = '移除';
    rm.textContent = '×';
    rm.addEventListener('click', () => {
      URL.revokeObjectURL(it.url);
      items.splice(i, 1);
      render();
    });
    const name = document.createElement('div');
    name.className = 'img-name';
    name.textContent = it.file.name;
    const dims = document.createElement('div');
    dims.className = 'img-dims';
    dims.textContent = it.im.naturalWidth + '×' + it.im.naturalHeight;
    card.appendChild(cv);
    card.appendChild(rm);
    card.appendChild(name);
    card.appendChild(dims);
    grid.appendChild(card);
  });
}

// 滑块变化 → 实时刷新预览（节流）
function scheduleRender() {
  clearTimeout(scheduleRender._t);
  scheduleRender._t = setTimeout(render, 60);
}
opacityRange.addEventListener('input', () => {
  opacity = +opacityRange.value;
  opacityVal.textContent = opacity + '%';
  scheduleRender();
});
sizeRange.addEventListener('input', () => {
  sizePct = +sizeRange.value;
  sizeVal.textContent = sizePct + '%';
  scheduleRender();
});

/* ===== 布局 / 格式切换 ===== */
const LAYOUT_BTN = {
  tile: document.querySelector('#layoutSeg button[data-layout=tile]'),
  center: document.querySelector('#layoutSeg button[data-layout=center]')
};
Object.values(LAYOUT_BTN).forEach(b => b.addEventListener('click', () => {
  layout = b.dataset.layout;
  Object.values(LAYOUT_BTN).forEach(x => x.classList.toggle('active', x === b));
  render();
}));
const FMT_BTN = {
  png: document.querySelector('.seg button[data-fmt=png]'),
  jpg: document.querySelector('.seg button[data-fmt=jpg]')
};
Object.values(FMT_BTN).forEach(b => b.addEventListener('click', () => {
  fmt = b.dataset.fmt;
  Object.values(FMT_BTN).forEach(x => x.classList.toggle('active', x === b));
}));

/* ===== 点击选择（支持多选） ===== */
dz.addEventListener('click', () => {
  const i = document.createElement('input');
  i.type = 'file';
  i.accept = 'image/*';
  i.multiple = true;
  i.onchange = () => { if (i.files.length) addFiles(i.files); };
  i.click();
});
// 上传区拖拽
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('dragover');
  if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

/* ===== 全屏拖拽 ===== */
const dropOverlay = $('dropOverlay');
let dragDepth = 0, showTimer = null;

function hideDropOverlay() {
  if (showTimer) { clearTimeout(showTimer); showTimer = null; }
  dropOverlay.classList.remove('show');
}
window.addEventListener('dragenter', e => {
  e.preventDefault();
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes('Files')) return;
  dragDepth++;
  if (!showTimer) showTimer = setTimeout(() => { dropOverlay.classList.add('show'); showTimer = null; }, 40);
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', e => {
  if (dragDepth > 0) dragDepth--;
  if (dragDepth === 0) hideDropOverlay();
});
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  hideDropOverlay();
  if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});

/* ===== 清空 ===== */
clearBtn.addEventListener('click', () => {
  items.forEach(it => URL.revokeObjectURL(it.url));
  items = [];
  render();
  statusEl.textContent = '';
  statusEl.className = 'status';
});

/* ===== 导出方式切换 ===== */
let dlMode = 'folder';   // folder=存文件夹 / each=逐个下载
const DL_MODE_BTN = {
  folder: document.querySelector('#dlModeSeg button[data-dlmode=folder]'),
  each: document.querySelector('#dlModeSeg button[data-dlmode=each]')
};
Object.values(DL_MODE_BTN).forEach(b => b.addEventListener('click', () => {
  dlMode = b.dataset.dlmode;
  Object.values(DL_MODE_BTN).forEach(x => x.classList.toggle('active', x === b));
}));

/* ===== 单张绘制 → Blob ===== */
async function renderBlob(it, mime, isPng) {
  const c = document.createElement('canvas');
  c.width = it.im.naturalWidth;
  c.height = it.im.naturalHeight;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  if (!isPng) { // JPG 无透明通道，先填白底避免变黑
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, c.width, c.height);
  }
  ctx.drawImage(it.im, 0, 0, c.width, c.height);
  drawWatermark(ctx, c.width, c.height, 0, 0);
  return await new Promise(r => c.toBlob(r, mime, isPng ? undefined : 0.92));
}

function baseName(it, ext) {
  return it.file.name.replace(/\.[^.]+$/, '') + '_水印.' + ext;
}

/* ===== 存文件夹模式（推荐：一次选目录，逐个写入，不经下载管理器） ===== */
async function exportToFolder(isPng, mime, ext) {
  if (!window.showDirectoryPicker) {
    statusEl.textContent = '当前浏览器不支持存文件夹，请改用逐个下载';
    return;
  }
  let dir;
  try {
    dir = await window.showDirectoryPicker();
  } catch (e) {
    if (e.name === 'AbortError') return;   // 用户取消选择
    statusEl.textContent = '选择文件夹失败：' + e.message;
    return;
  }
  let done = 0;
  for (const it of items) {
    statusEl.textContent = '正在保存 ' + (done + 1) + '/' + items.length + ' ...';
    const blob = await renderBlob(it, mime, isPng);
    // 同名自动加序号，避免覆盖
    let name = baseName(it, ext);
    let seq = 1;
    for (;;) {
      try {
        await dir.getFileHandle(name);
        name = it.file.name.replace(/\.[^.]+$/, '') + '_水印_' + (seq++) + '.' + ext;
      } catch {
        break;   // 不存在，可用
      }
    }
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(blob);
    await w.close();
    done++;
  }
  return done;
}

/* ===== 逐个下载模式（浏览器会拦截多文件，仅用于少量图） ===== */
async function exportEach(isPng, mime, ext) {
  let done = 0;
  const pendingUrls = [];
  for (const it of items) {
    statusEl.textContent = '正在导出 ' + (done + 1) + '/' + items.length + ' ...';
    const blob = await renderBlob(it, mime, isPng);
    const url = URL.createObjectURL(blob);
    pendingUrls.push(url);
    const a = document.createElement('a');
    a.href = url;
    a.download = baseName(it, ext);
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    // 间隔触发下载，避免浏览器连续多文件下载被丢弃
    await new Promise(r => setTimeout(r, 80));
    done++;
  }
  // 全部触发后再释放，保留 60s 确保下载完成（正常下载早已开始）
  setTimeout(() => pendingUrls.forEach(u => URL.revokeObjectURL(u)), 60000);
  return done;
}

/* ===== 批量导出 ===== */
exportBtn.addEventListener('click', async () => {
  if (!items.length) return;
  if (!wmImg.complete || !wmImg.naturalWidth) {
    statusEl.textContent = '水印尚未加载完成，请稍候再试';
    return;
  }
  const isPng = fmt === 'png';
  const mime = isPng ? 'image/png' : 'image/jpeg';
  const ext = isPng ? 'png' : 'jpg';
  const layoutName = layout === 'tile' ? '平铺' : '居中';
  const useFolder = dlMode === 'folder' && !!window.showDirectoryPicker;
  exportBtn.disabled = true;
  clearBtn.disabled = true;
  statusEl.className = 'status';
  let done;
  if (useFolder) {
    done = await exportToFolder(isPng, mime, ext);
  } else {
    done = await exportEach(isPng, mime, ext);
  }
  if (done === undefined) {   // 用户取消选目录等
    exportBtn.disabled = false;
    clearBtn.disabled = false;
    return;
  }
  exportBtn.disabled = false;
  clearBtn.disabled = false;
  statusEl.className = 'status done';
  statusEl.textContent = (useFolder ? '已保存 ' : '已导出 ') + done + ' 张加水印图片（' + layoutName + ' · 透明度 ' + opacity + '% · ' + (isPng ? 'PNG' : 'JPG') + '）';
});
</script>
