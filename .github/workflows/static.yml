# 构建并部署 R Language 专栏到 GitHub Pages
#
# 关键设计：产物是**白名单**，不是整个仓库。
#   旧版用 path: '.'，等于把整个仓库（含 zh/ 中文、pipeline/ 源码、site.toml）
#   全部打包成静态文件公开可下载，中文 Markdown 会因此变成可访问的网页。
#   这里只上传 index.html 与 R Language/en/，中文与流水线源码不进产物。
#
#   注：仓库是 public，源码本身在 GitHub 上仍可见；
#   本 workflow 保证的是「Pages 站点上不出现中文」。

name: Deploy R Language column to Pages

on:
  push:
    branches: ["main"]
    # 用「排除法」而不是「列举法」：除了明确不影响站点的文件，其余改动都重新部署。
    #
    # 列举法的问题：新增一个内容目录（比如以后加 "Python Language/"）时，
    # 忘记往列表里加就会静默不部署，而且很难查。
    # 排除法只会在新增「非站点文件」时多跑一次部署，代价小得多。
    paths-ignore:
      - "**/*.md"          # 文档；文章源改动必然连带 index.html，由后者触发
      - "_archive/**"      # 历史存档，不参与构建
      - ".markdownlint-cli2.jsonc"
      - "tools/**"         # 与本专栏无关
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: python -m pip install --upgrade pip jinja2 markdown pygments

      - name: Verify index.html matches the content
        env:
          PYTHONPATH: ${{ github.workspace }}/R Language/pipeline/src
        working-directory: "R Language/pipeline"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from rlang_pipeline.paths import get_paths
          from rlang_pipeline.config import load_site_config
          from rlang_pipeline.build import build_index

          paths = get_paths()
          config = load_site_config(paths.site_config)
          expected, count, _ = build_index(paths, config, dry_run=True)
          actual = paths.site_output.read_text(encoding="utf-8")
          if actual != expected:
              print(f"index.html 已过期（当前内容 {count} 篇）。请本地运行：")
              print("    uv run python -m rlang_pipeline build")
              sys.exit(1)
          print(f"index.html 与内容一致，共 {count} 篇文章")
          PY

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p "_site/R Language"

          cp index.html _site/index.html
          touch _site/.nojekyll

          # 保持与仓库同构的路径：_site/R Language/en/...
          # 这样文章页里的相对链接（../index.html 指向 en/index.html）
          # 在本地和线上完全一致，不需要在构建时区分环境。
          cp -r "R Language/en" "_site/R Language/en"

          # 断言：产物里不允许出现中文内容或流水线源码
          if [ -d "_site/R Language/zh" ]; then
            echo "::error::中文目录进入了 Pages 产物"
            exit 1
          fi
          if find _site \( -name "*.py" -o -name "site.toml" -o -name "*.j2" \) | grep -q .; then
            echo "::error::流水线源码进入了 Pages 产物"
            find _site \( -name "*.py" -o -name "site.toml" -o -name "*.j2" \)
            exit 1
          fi
          if grep -rl "zhihu-title" _site 2>/dev/null | grep -q .; then
            echo "::error::产物中检出中文 frontmatter"
            grep -rl "zhihu-title" _site
            exit 1
          fi

          echo "产物概况："
          find _site -maxdepth 3 | sort | head -40
          echo "产物大小：$(du -sh _site | cut -f1)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
